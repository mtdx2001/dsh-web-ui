# bundle patch for the dsh-balance-rows plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-balance-rows`.
- insert:
    - id: ui-dsh-balance-rows
      name: '@mtdx2001/dsh-client-ui-balance-rows'
