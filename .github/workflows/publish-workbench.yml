name: Publish Workbench

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Workbench release version
        required: true
        default: 0.1.20

permissions:
  contents: read

concurrency:
  group: publish-workbench-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_DIR: release-assets/workbench-${{ inputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Use supported npm
        run: npm install --global npm@11.15.0

      - name: Verify requested version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION" = "0.1.20"
          for manifest in \
            packages/dsh-workbench/package.json \
            packages/dsh-balance-rows/package.json \
            packages/dsh-workbench-suite/package.json
          do
            test "$(node -p "require('./$manifest').version")" = "$VERSION"
            test "$(node -p "require('./$manifest').dsh.engines.dsh")" = ">=0.1.1-rc.1"
            test "$(node -p "require('./$manifest').dsh.bundle.patch")" = "./cordis.patch.yml"
          done

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate release tooling
        run: |
          node --test scripts/workbench-release.test.mjs
          node --test scripts/aggregate.test.mjs
          pnpm aggregate:check
          pnpm runtime-deps:check
          pnpm sync-shared:check
          pnpm docs:check

      - name: Validate Workbench
        run: |
          pnpm --filter @mtdx2001/dsh-client-ui-workbench typecheck
          pnpm --filter @mtdx2001/dsh-client-ui-workbench test
          pnpm --filter @mtdx2001/dsh-client-ui-workbench build

      - name: Validate Balance Rows and Suite
        run: |
          pnpm --filter @mtdx2001/dsh-client-ui-balance-rows typecheck
          pnpm --filter @mtdx2001/dsh-client-ui-balance-rows test
          pnpm --filter @mtdx2001/dsh-client-ui-balance-rows build
          pnpm --filter @mtdx2001/dsh-workbench-suite build

      - name: Pack immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          pnpm --filter @mtdx2001/dsh-client-ui-workbench pack --pack-destination "$GITHUB_WORKSPACE/$RELEASE_DIR"
          pnpm --filter @mtdx2001/dsh-client-ui-balance-rows pack --pack-destination "$GITHUB_WORKSPACE/$RELEASE_DIR"
          pnpm --filter @mtdx2001/dsh-workbench-suite pack --pack-destination "$GITHUB_WORKSPACE/$RELEASE_DIR"

      - name: Audit artifacts and plan registry changes
        run: |
          node scripts/workbench-release.mjs audit "$RELEASE_DIR" "$VERSION"
          node scripts/workbench-release.mjs plan "$RELEASE_DIR" "$VERSION"

      - name: Stage audited publication artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-input/release-assets
          cp "$RELEASE_DIR"/*.tgz publish-input/release-assets/
          cp scripts/workbench-release.mjs publish-input/

      - name: Upload audited publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ inputs.version }}-${{ github.sha }}
          path: publish-input
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_DIR: publish-input/release-assets

    steps:
      - name: Download audited publication artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workbench-${{ inputs.version }}-${{ github.sha }}
          path: publish-input

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Use OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Reaudit immutable artifacts
        run: |
          node publish-input/workbench-release.mjs audit "$RELEASE_DIR" "$VERSION"
          node publish-input/workbench-release.mjs plan "$RELEASE_DIR" "$VERSION"

      - name: Publish or resume through npm Trusted Publishing
        run: node publish-input/workbench-release.mjs publish "$RELEASE_DIR" "$VERSION"

      - name: Verify registry consumer installation
        shell: bash
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          cache="$(mktemp -d)"
          printf '{"name":"workbench-registry-smoke","private":true,"version":"1.0.0"}\n' > "$smoke/package.json"
          npm install --prefix "$smoke" --cache "$cache" --prefer-online --ignore-scripts \
            --registry=https://registry.npmjs.org/ "@mtdx2001/dsh-workbench-suite@$VERSION"
          node - "$smoke" "$VERSION" <<'NODE'
          const { existsSync, readFileSync } = require('node:fs')
          const { join } = require('node:path')
          const root = process.argv[2]
          const version = process.argv[3]
          const expected = {
            '@mtdx2001/dsh-client-ui-workbench': version,
            '@mtdx2001/dsh-client-ui-balance-rows': version,
            '@mtdx2001/dsh-workbench-suite': version,
            '@linxin666/dsh-client-ui-aionui-panel': '0.1.19',
            '@linxin666/dsh-client-ui-task-board': '0.1.19',
            '@linxin666/dsh-ssh': '0.1.19',
          }
          for (const [name, wanted] of Object.entries(expected)) {
            const manifest = JSON.parse(readFileSync(join(root, 'node_modules', name, 'package.json'), 'utf8'))
            if (manifest.version !== wanted) throw new Error(`${name}: expected ${wanted}, received ${manifest.version}`)
            if (manifest.dsh?.bundle?.patch && !existsSync(join(root, 'node_modules', name, manifest.dsh.bundle.patch))) {
              throw new Error(`${name}: bundle patch is missing`)
            }
          }
          NODE
