name: Publish Workbench stage30

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/workbench-stage30-trusted-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - 名称: 检出发布资产
        使用: actions/checkout@v5

      - 名称: 设置 Node.js
        使用: actions/setup-node@v5
        使用:
          node-version: 24
注册表地址: https://registry.npmjs.org

      - 使用支持 OIDC 的 npm
运行: npm install --global npm@11.11.0

      - 名称: 验证已审计的 tarball
        shell: bash
        run: |
          cd release-assets/workbench-stage30
          echo 'BF74476B5449B14F76CF9919D132140C992D742E5A0ABA5C12BD399159C39E04  mtdx2001-dsh-client-ui-workbench-0.1.19.tgz' | sha256sum --check --strict
          echo 'BB7188D035A0ECBE682ECA6E4DACB1B63A8349D4EC90D3E483B97E36770D0905  mtdx2001-dsh-client-ui-balance-rows-0.1.19.tgz' | sha256sum --check --strict
          echo 'D2ED31F26AF201958DAE44FA66F3509FB884D1BCB850DE0CE3FB3BD7E2B11C5E  mtdx2001-dsh-workbench-suite-0.1.19.tgz' | sha256sum --check --strict

      - name: 发布工作台
        运行: npm publish release-assets/workbench-stage30/mtdx2001-dsh-client-ui-workbench-0.1.19.tgz --access public --provenance --registry=https://registry.npmjs.org/

      - 名称: 验证工作台
        运行: npm view @mtdx2001/dsh-client-ui-workbench@0.1.19 version --registry=https://registry.npmjs.org/

      - 名称: 发布余额行
        运行: npm publish release-assets/workbench-stage30/mtdx2001-dsh-client-ui-balance-rows-0.1.19.tgz --access public --provenance --registry=https://registry.npmjs.org/

      - 名称: 验证余额行
运行: npm view @mtdx2001/dsh-client-ui-balance-rows@0.1.19 version --registry=https://registry.npmjs.org/

      - 名称: Publish Suite
        运行: npm publish release-assets/workbench-stage30/mtdx2001-dsh-workbench-suite-0.1.19.tgz --access public --provenance --registry=https://registry.npmjs.org/

      - 名称: 验证套件
        运行: npm view @mtdx2001/dsh-workbench-suite@0.1.19 version --registry=https://registry.npmjs.org/
